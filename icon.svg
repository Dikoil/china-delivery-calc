<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="boxTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e7ba84"/>
      <stop offset="100%" stop-color="#d49e62"/>
    </linearGradient>
    <linearGradient id="boxLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cf9455"/>
      <stop offset="100%" stop-color="#b57a3c"/>
    </linearGradient>
    <linearGradient id="boxRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b98144"/>
      <stop offset="100%" stop-color="#96612a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g transform="translate(56, 56) scale(0.78125)">
    <!-- Box Shadow -->
    <ellipse cx="256" cy="442" rx="154" ry="26" fill="rgba(15, 23, 42, 0.12)"/>
    <!-- Top face -->
    <polygon points="256,76 436,162 256,248 76,162" fill="url(#boxTop)" stroke="#8c5823" stroke-width="6" stroke-linejoin="round"/>
    <!-- Left face -->
    <polygon points="76,162 256,248 256,426 76,340" fill="url(#boxLeft)" stroke="#8c5823" stroke-width="6" stroke-linejoin="round"/>
    <!-- Right face -->
    <polygon points="436,162 256,248 256,426 436,340" fill="url(#boxRight)" stroke="#8c5823" stroke-width="6" stroke-linejoin="round"/>
    <!-- Packing tape on top & front -->
    <polygon points="228,89 284,116 184,194 128,167" fill="#f3dcb8" opacity="0.88"/>
    <polygon points="128,187 184,214 184,274 128,247" fill="#ebd0a4" opacity="0.92"/>
    <!-- Green check badge -->
    <circle cx="390" cy="368" r="68" fill="#16a34a" stroke="#ffffff" stroke-width="12"/>
    <path d="M358 368 L381 391 L424 345" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
